<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GenLayer Orbital Validator Shield</title>
  <style>
    body { font-family: sans-serif; background: #0A0A12; color: #FFF; text-align: center; padding: 40px; }
    body.light { background: #F8F9FA; color: #111; }
    .btn { background: #FF7A00; color: #FFF; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 30px; }
    .grid { display: flex; justify-content: center; gap: 30px; align-items: flex-end; margin-top: 20px; }
    .box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; }
    body.light .box { background: #EEE; }
  </style>
</head>
<body>
  <h1>Orbital Validator Shield on Monogram</h1>
  <p style="color:#888; margin-bottom:20px;">AI Consensus Orbit surrounding GenLayer Monogram</p>
  <button class="btn" onclick="document.body.classList.toggle('light')">Toggle Dark / Light Mode</button>
  <div class="grid">
    <div class="box"><img src="spinner.svg" width="16" height="16"><p style="font-size:12px; margin-top:10px;">16px (Micro)</p></div>
    <div class="box"><img src="spinner.svg" width="32" height="32"><p style="font-size:12px; margin-top:10px;">32px (Button)</p></div>
    <div class="box"><img src="spinner.svg" width="64" height="64"><p style="font-size:12px; margin-top:10px;">64px (Card)</p></div>
    <div class="box"><img src="spinner.svg" width="128" height="128"><p style="font-size:12px; margin-top:10px;">128px (Hero)</p></div>
  </div>
</body>
</html>
