<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gl-orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#F36A22" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="gl-logo-glow" cx="50%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0A0A12" stop-opacity="0" />
    </radialGradient>
    <filter id="gl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .gl-orbit-ring {
      transform-origin: 50px 54px;
      animation: gl-rotate-360 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .gl-logo-center {
      transform-origin: 50px 54px;
      animation: gl-logo-breathe 1.2s ease-in-out infinite alternate;
    }
    .gl-ring-track {
      stroke: rgba(243, 106, 34, 0.15);
      stroke-width: 3.5;
      fill: none;
    }
    .gl-ring-arc {
      stroke: url(#gl-orbit-grad);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 60 140;
      fill: none;
      filter: url(#gl-glow);
    }

    @keyframes gl-rotate-360 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes gl-logo-breathe {
      0% { transform: scale(0.92); opacity: 0.75; }
      100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 6px #FF7A00); }
    }
  </style>

  <circle cx="50" cy="54" r="24" fill="url(#gl-logo-glow)" />

  <g class="gl-logo-center">
    <polygon points="47,14 47,40 34,66 47,72 14,86" fill="url(#gl-orbit-grad)" />
    <polygon points="53,14 53,40 66,66 53,72 86,86" fill="url(#gl-orbit-grad)" />
    <polygon points="50,48 58,58 50,68 42,58" fill="#FFFFFF" filter="drop-shadow(0 0 3px #FFFFFF)" />
    <circle cx="50" cy="58" r="2" fill="#FF7A00" />
  </g>

  <g class="gl-orbit-ring">
    <circle class="gl-ring-track" cx="50" cy="54" r="38" />
    <circle class="gl-ring-arc" cx="50" cy="54" r="38" />

    <g transform="translate(50, 54) rotate(0) translate(38, 0)">
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" filter="drop-shadow(0 0 3px #FF7A00)" />
      <circle cx="0" cy="0" r="2" fill="#FF7A00" />
    </g>
    <g transform="translate(50, 54) rotate(120) translate(38, 0)">
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" filter="drop-shadow(0 0 3px #8B5CF6)" />
      <circle cx="0" cy="0" r="1.5" fill="#8B5CF6" />
    </g>
    <g transform="translate(50, 54) rotate(240) translate(38, 0)">
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" filter="drop-shadow(0 0 3px #F36A22)" />
      <circle cx="0" cy="0" r="1.5" fill="#F36A22" />
    </g>
  </g>
</svg>
