<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gl-orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#F36A22" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="gl-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="1" />
      <stop offset="60%" stop-color="#F36A22" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F36A22" stop-opacity="0" />
    </radialGradient>
    <filter id="gl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .gl-spinner-group {
      transform-origin: 50px 50px;
      animation: gl-rotate-orbit 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .gl-orbit-path-back { stroke: rgba(243, 106, 34, 0.15); stroke-width: 4; fill: none; }
    .gl-orbit-arc-1 {
      stroke: url(#gl-orbit-grad); stroke-width: 4.5; stroke-linecap: round;
      stroke-dasharray: 60 140; fill: none;
      animation: gl-arc-pulse-1 2.4s ease-in-out infinite;
    }
    .gl-orbit-arc-2 {
      stroke: #FF7A00; stroke-width: 4.5; stroke-linecap: round;
      stroke-dasharray: 35 165; stroke-dashoffset: -110; fill: none;
      filter: url(#gl-glow); animation: gl-arc-pulse-2 2.4s ease-in-out infinite;
    }
    .gl-core-node {
      transform-origin: 50px 50px;
      animation: gl-core-pulse 1.2s ease-in-out infinite alternate;
    }
    .gl-validator-node { fill: #FFFFFF; filter: drop-shadow(0 0 3px #FF7A00); }
    @keyframes gl-rotate-orbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes gl-core-pulse { 0% { transform: scale(0.85); opacity: 0.75; } 100% { transform: scale(1.15); opacity: 1; } }
    @keyframes gl-arc-pulse-1 { 0%, 100% { stroke-dasharray: 40 160; } 50% { stroke-dasharray: 90 110; } }
    @keyframes gl-arc-pulse-2 { 0%, 100% { stroke-dashoffset: -110; } 50% { stroke-dashoffset: -80; } }
  </style>
  <circle class="gl-core-node" cx="50" cy="50" r="14" fill="url(#gl-core-glow)" />
  <circle cx="50" cy="50" r="5" fill="#FF7A00" />
  <circle cx="50" cy="50" r="2.5" fill="#FFFFFF" />
  <g class="gl-spinner-group">
    <circle class="gl-orbit-path-back" cx="50" cy="50" r="34" />
    <circle class="gl-orbit-arc-1" cx="50" cy="50" r="34" />
    <circle class="gl-orbit-arc-2" cx="50" cy="50" r="34" />
    <g transform="translate(50, 50) rotate(0) translate(34, 0)">
      <circle class="gl-validator-node" cx="0" cy="0" r="4.5" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="2" fill="#FF7A00" />
    </g>
    <g transform="translate(50, 50) rotate(120) translate(34, 0)">
      <circle class="gl-validator-node" cx="0" cy="0" r="3.5" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="1.5" fill="#8B5CF6" />
    </g>
    <g transform="translate(50, 50) rotate(240) translate(34, 0)">
      <circle class="gl-validator-node" cx="0" cy="0" r="3.5" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="1.5" fill="#F36A22" />
    </g>
  </g>
</svg>
